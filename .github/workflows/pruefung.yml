# Prüfwerkzeuge bei jedem Push — auf einem fremden, englischen Windows.
#
# Warum das mehr ist als Bequemlichkeit: WinZii wurde auf EINEM deutschen
# Windows 11 entwickelt. »Nicht-deutsches Windows« steht seit der ersten
# Fassung als Grenze im README, weil es hier schlicht nicht prüfbar ist.
# Die GitHub-Läufer sind englische Windows-Server — damit fällt diese Grenze
# bei jedem Push, ohne dass jemand daran denken muss.
#
# Gesucht wird genau die Sorte Fehler, die auf dem Entwicklungsrechner nie
# auftritt: Zahlen- und Datumsformate, Vergleiche gegen übersetzte
# Windows-Ausgaben, Annahmen über den Suchpfad.
#
# shell: powershell ist Windows PowerShell 5.1 — das Ziel von WinZii.
# pwsh (PowerShell 7) wäre eine andere Laufzeit und würde am Ziel vorbeiprüfen.

name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Der Lauf liest nur. Ohne diese Angabe bekam das Token die Standardrechte
# des Repos (Audit 2026-10, M33).
permissions:
  contents: read

# Ein neuer Push auf denselben Zweig bricht den alten Lauf ab, statt ihn
# zehn Minuten weiterlaufen zu lassen.
concurrency:
  group: pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefwerkzeuge:
    name: Prüfwerkzeuge (englisches Windows)
    runs-on: windows-latest
    # Test-Dialogs blockiert in ShowDialog(); feuert ContentRendered nicht,
    # hing der Job bisher bis zur Sechs-Stunden-Grenze (M33).
    timeout-minutes: 30

    steps:
      # Actions per Commit-SHA gepinnt, die Fassung steht dahinter (M34).
      # Dependabot (.github/dependabot.yml) schlägt Aktualisierungen vor.
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Umgebung nennen
        shell: powershell
        run: |
          Write-Host "Windows:  $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Write-Host "Sprache:  $((Get-UICulture).Name)"
          Write-Host "Kultur:   $((Get-Culture).Name)"
          Write-Host "PS:       $($PSVersionTable.PSVersion)"

      - name: PSScriptAnalyzer einrichten
        shell: powershell
        run: |
          # Feste Fassung: Eine neue Regel in einer neuen Fassung soll nicht
          # unangekündigt die CI rot machen (M34).
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Write-Host "PSScriptAnalyzer $((Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version)"

      # Die Werkzeuge laufen einzeln, damit im Protokoll steht, welches
      # gefallen ist. »if: always()« hält den Lauf am Leben, bis alle durch
      # sind — ein Fehlschlag im ersten würde sonst die übrigen verdecken.
      - name: Test-Smoke
        if: always()
        shell: powershell
        run: .\tools\Test-Smoke.ps1

      - name: Test-Language
        if: always()
        shell: powershell
        run: .\tools\Test-Language.ps1

      - name: Test-Catalogs
        if: always()
        shell: powershell
        run: .\tools\Test-Catalogs.ps1

      - name: Test-Pages
        if: always()
        shell: powershell
        run: .\tools\Test-Pages.ps1

      # Deutet WinZii die Ausgaben von sfc, pnputil und winget auch auf Englisch
      # richtig? Geprueft gegen die echten Wortlaute beider Sprachen.
      - name: Test-Parsers
        if: always()
        shell: powershell
        run: .\tools\Test-Parsers.ps1

      - name: Test-Contrast
        if: always()
        shell: powershell
        run: .\tools\Test-Contrast.ps1

      - name: Test-Office
        if: always()
        shell: powershell
        run: .\tools\Test-Office.ps1

      - name: Test-Report
        if: always()
        shell: powershell
        run: .\tools\Test-Report.ps1

      - name: Test-Modules
        if: always()
        shell: powershell
        run: .\tools\Test-Modules.ps1

      - name: Test-Process
        if: always()
        shell: powershell
        run: .\tools\Test-Process.ps1

      # Fasst die Registry und legt kurzzeitig einen Energieplan an. Auf einem
      # Wegwerf-Läufer ist das unbedenklich; auf einem echten Gerät wäre es
      # das auch, denn das Werkzeug stellt den Ausgangszustand wieder her.
      - name: Test-Undo
        if: always()
        shell: powershell
        run: .\tools\Test-Undo.ps1

      # Braucht einen STA-Faden und baut echte WPF-Fenster. Ob das auf einem
      # Läufer ohne angemeldete Sitzung trägt, entscheidet der erste Lauf.
      - name: Test-Dialogs
        if: always()
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File .\tools\Test-Dialogs.ps1

      # Startet das Programm wirklich, schaltet mitten in der Sitzung um und
      # sieht nach, ob auch die gemessenen Statustexte mitgehen. Der einzige
      # Weg, das zu pruefen — im Quelltext sah der Fehler richtig aus.
      - name: Test-LanguageSwitch
        if: always()
        shell: powershell
        run: .\tools\Test-LanguageSwitch.ps1

      # Warnungen und Parse-Fehler zählen als Fehlschlag (H13).
      - name: Invoke-Analyzer
        if: always()
        shell: powershell
        run: .\tools\Invoke-Analyzer.ps1

      # Das Release-Werkzeug lief bisher nie in der CI; ein Fehler darin fiel
      # erst beim Veröffentlichen auf. Trockenlauf ins Temp-Verzeichnis (M40).
      - name: New-Release (Trockenlauf)
        if: always()
        shell: powershell
        run: .\tools\New-Release.ps1 -OutputDir $env:RUNNER_TEMP

  oberflaeche:
    name: Oberfläche starten und abbilden
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Der Selbsttest baut das Fenster wirklich auf, wechselt auf eine Seite
      # und legt ein Abbild ab. Auf einem fremden System ist das der Nachweis,
      # dass WinZii nicht nur syntaktisch heil ist, sondern startet.
      - name: Start in beiden Sprachen
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force abbilder | Out-Null
          $fehler = 0
          foreach ($sprache in 'de', 'en') {
            $env:WZ_SELFTEST = '9000'
            $env:WZ_SELFTEST_LANG = $sprache
            $env:WZ_SELFTEST_PAGE = 'Dashboard'
            $env:WZ_SELFTEST_OUT = (Join-Path $PWD "abbilder\dashboard-$sprache.png")
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\src\launcher.ps1 -NoElevate
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Start auf $sprache endete mit $LASTEXITCODE"; $fehler++ }
            if (-not (Test-Path $env:WZ_SELFTEST_OUT)) { Write-Host "::error::Kein Abbild für $sprache"; $fehler++ }
          }
          if ($fehler -gt 0) { exit 1 }

      # Fährt jede Seite bei 1000×560 an und misst, ob ein Wort mitten
      # durchbricht. Lief bisher nur von Hand (M40); dauert rund 5 Minuten.
      - name: Test-Layout
        if: always()
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -STA -File .\tools\Test-Layout.ps1

      - name: Abbilder aufbewahren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-abbilder
          path: abbilder/
          if-no-files-found: warn

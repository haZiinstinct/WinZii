# Die Actions sind per Commit-SHA gepinnt (Audit 2026-10, M34). Damit sie
# nicht veralten, schlägt Dependabot neue Fassungen als PR vor — mit SHA und
# Versionskommentar, so wie sie in den Workflows stehen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: CI
